profile_id: cumcm_v1
competition_name: China Undergraduate Mathematical Contest in Modeling (CUMCM)
rule_version: "1.0"
mode: contest_compliant
notes: >
  Template profile. Competition rules change yearly and vary on permitted tool
  use; CONFIRM the current official rules and update before any real use. This
  tool is a copilot, not an autonomous submission engine.
source_reference: "Update with the official CUMCM rules document for the year."

allowed_capabilities:
  problem_parsing: true
  method_retrieval: true
  strategy_suggestions: true
  code_generation: true
  sandbox_execution: true
  report_drafting: true
  citation_verification: true
  latex_export: true
  auto_export: false

required_checkpoints:
  - problem_understanding
  - strategy_selection
  - final_report

required_disclosure_fields:
  - provider
  - model_identifier
  - purpose
  - stage
  - human_edits
  - human_confirmation

restricted_actions:
  - hidden_ai_usage
  - fabricated_metrics
  - export_without_final_approval
