profile_id: mcm_icm_v1
competition_name: Mathematical/Interdisciplinary Contest in Modeling (MCM/ICM)
rule_version: "1.0"
mode: contest_compliant
notes: >
  Template profile. MCM/ICM requires an AI-use report when AI tools are used;
  this profile enforces disclosure and human checkpoints. CONFIRM the current
  official COMAP rules and update before any real use.
source_reference: "Update with the official COMAP MCM/ICM rules for the year."

allowed_capabilities:
  problem_parsing: true
  method_retrieval: true
  strategy_suggestions: true
  code_generation: true
  sandbox_execution: true
  report_drafting: true
  citation_verification: true
  latex_export: true
  auto_export: false

required_checkpoints:
  - problem_understanding
  - strategy_selection
  - final_report

required_disclosure_fields:
  - provider
  - model_identifier
  - purpose
  - stage
  - human_edits
  - human_confirmation

restricted_actions:
  - hidden_ai_usage
  - fabricated_metrics
  - export_without_final_approval
