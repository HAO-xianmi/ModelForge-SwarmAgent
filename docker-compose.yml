# Production-like local deployment (spec section 34.2).
# For the zero-dependency MVP you do NOT need this: SQLite + subprocess sandbox
# + mock LLM run with `pip install -e .` alone. This compose file is for the
# fuller stack (Postgres, API, sandbox image).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: modelforge
      POSTGRES_PASSWORD: modelforge
      POSTGRES_DB: modelforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://modelforge:modelforge@db:5432/modelforge
      REDIS_URL: redis://redis:6379/0
      MODELFORGE_LLM: ${MODELFORGE_LLM:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MODELFORGE_SANDBOX: docker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./runs:/app/runs
      # The sandbox runner needs access to the host Docker daemon:
      - /var/run/docker.sock:/var/run/docker.sock

  sandbox-image:
    # One-shot build of the sandbox execution image used by the runner.
    build:
      context: docker/sandbox
      dockerfile: Dockerfile
    image: modelforge-sandbox:latest
    command: ["python", "--version"]

volumes:
  pgdata:
